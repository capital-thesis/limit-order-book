name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cxx: g++
            build_type: Release
            sanitize: OFF
          - name: clang-release
            cxx: clang++
            build_type: Release
            sanitize: OFF
          - name: clang-asan-ubsan
            cxx: clang++
            build_type: Debug
            sanitize: ON
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLOB_WERROR=ON
          -DLOB_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
        